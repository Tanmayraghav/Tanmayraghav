<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Tanmay Raghav terminal profile header</title>
  <desc id="desc">A minimal dark terminal window with a command prompt, Tanmay Raghav's name, developer interests, and online indicator.</desc>
  <rect x="1" y="1" width="1198" height="218" rx="13" fill="#0b0f14" stroke="#39414d" stroke-width="2"/>
  <path d="M2 43 H1198" stroke="#303844" stroke-width="1.5"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="66" cy="22" r="6" fill="#28c840"/>
  <text x="600" y="27" text-anchor="middle" fill="#84909f" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">tanmay@github</text>
  <circle cx="1110" cy="22" r="4.5" fill="#35c46a">
    <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1124" y="27" fill="#9ba6b5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">online</text>
  <text x="28" y="83" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
    <tspan fill="#35c46a">tanmay@github</tspan><tspan fill="#8792a2"> ~ $ </tspan><tspan fill="#dbe5f0">whoami</tspan>
  </text>
  <text x="28" y="130" fill="#4ea1ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="31" font-weight="700" letter-spacing="0.3">tanmay raghav</text>
  <rect x="315" y="105" width="11" height="27" rx="1" fill="#4ea1ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="28" y="165" fill="#8b96a5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">ai / data science / developer / automation</text>
  <text x="28" y="195" fill="#536171" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">B.Tech CSE · GLA University</text>
</svg>